<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillForge | Career Readiness Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 70px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #4f46e5;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">SkillForge</div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1>Build Skills. <span>Build Your Career.</span></h1>

            <p>
                SkillForge is a career readiness platform that helps
                students develop skills, build projects, prepare for
                interviews, and track their career progress.
            </p>

           <a href="/accounts/register/" class="btn">Get Started</a>
        </div>
    </main>

</body>
</html>
